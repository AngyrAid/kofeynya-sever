<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="950" viewBox="0 0 1400 950"><rect width="1400" height="950" fill="#fffdf8"/><circle cx="70" cy="45" r="25" fill="#263b32"/><text x="70" y="54" text-anchor="middle" font-size="28" fill="#f5f1e8" font-family="Georgia">С</text><text x="110" y="48" font-size="30" font-weight="bold" fill="#263b32" font-family="Arial">север<tspan fill="#d97b4c">.</tspan></text><text x="111" y="65" font-size="8" letter-spacing="2" fill="#6d766e" font-family="Arial">КОФЕЙНЯ НА КАЖДЫЙ ДЕНЬ</text><g font-family="Arial" font-size="13" fill="#59645b"><text x="600" y="51">Главная</text><text x="690" y="51">Меню</text><text x="755" y="51">О нас</text><text x="820" y="51">С собой</text><text x="900" y="51">Контакты</text></g><text x="90" y="155" font-family="Arial" font-size="11" letter-spacing="3" fill="#d97b4c">ТВОЁ ТИХОЕ МЕСТО В ГОРОДЕ</text><text x="90" y="255" font-family="Georgia" font-size="78" fill="#263b32">Пусть день</text><text x="90" y="340" font-family="Georgia" font-size="78" fill="#263b32">начнётся <tspan font-style="italic" fill="#d97b4c">с кофе.</tspan></text><text x="90" y="397" font-family="Arial" font-size="17" fill="#6d766e">Честный кофе, тёплая выпечка и место,</text><text x="90" y="425" font-family="Arial" font-size="17" fill="#6d766e">где можно немного замедлиться.</text><rect x="90" y="465" width="220" height="52" rx="26" fill="#263b32"/><text x="200" y="497" font-family="Arial" font-size="13" text-anchor="middle" fill="#fffdf8">Посмотреть меню ↗</text><rect x="770" y="115" width="510" height="485" rx="210" fill="#e8e5d6"/><circle cx="1025" cy="295" r="140" fill="#e9bd69"/><ellipse cx="1020" cy="500" rx="160" ry="17" fill="#b4b6a4"/><path d="M930 330 L1110 330 L1095 465 Q1088 510 1020 510 Q952 510 945 465 Z" fill="#fffdf6"/><ellipse cx="1020" cy="332" rx="90" ry="25" fill="#5a3c2b" stroke="#f9f4e9" stroke-width="10"/><path d="M1100 365 C1180 350 1180 440 1100 435" fill="none" stroke="#f4ead8" stroke-width="18"/><text x="1020" y="420" text-anchor="middle" font-family="Georgia" font-size="28" font-style="italic" fill="#263b32">север</text><text x="90" y="665" font-family="Arial" font-size="11" letter-spacing="3" fill="#d97b4c">МАЛЕНЬКОЕ УДОВОЛЬСТВИЕ</text><text x="90" y="720" font-family="Georgia" font-size="47" fill="#263b32">Что сегодня <tspan font-style="italic" fill="#d97b4c">по душе?</tspan></text><g font-family="Georgia" font-size="27" fill="#26352d"><rect x="90" y="755" width="385" height="155" rx="20" fill="#e7e9dc"/><rect x="507" y="755" width="385" height="155" rx="20" fill="#f3e2d3"/><rect x="924" y="755" width="385" height="155" rx="20" fill="#eee8d3"/><text x="120" y="820">Кофе, который</text><text x="120" y="855">понимает тебя</text><text x="537" y="820">Выпечка</text><text x="537" y="855">каждое утро</text><text x="954" y="820">Место для</text><text x="954" y="855">своих мыслей</text></g><text x="1300" y="935" text-anchor="end" font-family="Arial" font-size="10" fill="#7d857b">МАКЕТ ГЛАВНОЙ · УЧЕБНЫЙ ПРОЕКТ</text></svg>